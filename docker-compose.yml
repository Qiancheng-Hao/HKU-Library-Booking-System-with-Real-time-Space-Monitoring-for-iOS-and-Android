services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: hku_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hku_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hku_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: hku_mediamtx
    profiles:
      - streaming
    environment:
      MTX_RTSPTRANSPORTS: tcp
      MTX_WEBRTCADDITIONALHOSTS: ${MTX_WEBRTC_ADDITIONAL_HOSTS:-127.0.0.1}
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8890:8890/udp"
      - "8189:8189/udp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  stream1:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: hku_stream1
    profiles:
      - streaming
    depends_on:
      - mediamtx
    command: >
      -re -stream_loop -1 -i https://fyp.tos-cn-hongkong.volces.com/stream1.mp4
      -an -vf scale=640:360,fps=1 -r 1
      -c:v libx264 -profile:v baseline -level 3.1
      -preset ultrafast -tune zerolatency
      -b:v 200k -bufsize 400k -g 30
      -f flv rtmp://mediamtx:1935/stream1

  stream2:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: hku_stream2
    profiles:
      - streaming
    depends_on:
      - mediamtx
    command: >
      -re -stream_loop -1 -i https://fyp.tos-cn-hongkong.volces.com/stream2.mp4
      -an -vf scale=640:360,fps=1 -r 1
      -c:v libx264 -profile:v baseline -level 3.1
      -preset ultrafast -tune zerolatency
      -b:v 200k -bufsize 400k -g 30
      -f flv rtmp://mediamtx:1935/stream2

  stream3:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: hku_stream3
    profiles:
      - streaming
    depends_on:
      - mediamtx
    command: >
      -re -stream_loop -1 -i https://fyp.tos-cn-hongkong.volces.com/stream3.mp4
      -an -vf scale=640:360,fps=1 -r 1
      -c:v libx264 -profile:v baseline -level 3.1
      -preset ultrafast -tune zerolatency
      -b:v 200k -bufsize 400k -g 30
      -f flv rtmp://mediamtx:1935/stream3

  stream4:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: hku_stream4
    profiles:
      - streaming
    depends_on:
      - mediamtx
    command: >
      -re -stream_loop -1 -i https://fyp.tos-cn-hongkong.volces.com/stream4.mp4
      -an -vf scale=640:360,fps=1 -r 1
      -c:v libx264 -profile:v baseline -level 3.1
      -preset ultrafast -tune zerolatency
      -b:v 200k -bufsize 400k -g 30
      -f flv rtmp://mediamtx:1935/stream4

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
